<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YA Admin</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header><a class="logo" href="index.html">YA</a><nav><a href="index.html">Store</a></nav></header>
<main class="admin-page">
<section class="panel" id="loginPanel">
<p class="eyebrow">YA ADMIN</p><h1>Sign in</h1>
<form id="loginForm">
<input id="email" type="email" autocomplete="username" placeholder="Admin email" required>
<input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
<button class="button" type="submit">Sign in</button>
</form>
<p id="loginStatus">Ready.</p>
</section>
<section class="panel hidden" id="adminPanel">
<div class="section-head"><div><p class="eyebrow">ADMIN DASHBOARD</p><h1>Products</h1></div>
<button class="small-button" id="logoutBtn" type="button">Log out</button></div>
<form id="productForm">
<input id="name" required placeholder="Product name">
<input id="price" required type="number" step="0.01" placeholder="Price">
<select id="category"><option>T-Shirts</option><option>Hoodies</option><option>Pants</option><option>Accessories</option></select>
<input id="sizes" placeholder="Sizes: S, M, L, XL">
<input id="image" type="file" accept="image/*">
<textarea id="description" placeholder="Description"></textarea>
<button class="button" type="submit">Add product</button>
</form>
<p id="formStatus"></p><div id="adminProducts" class="products"></div>
</section>
</main>
<script>
const SUPABASE_URL="https://icssrjznamxqayrsfvmf.supabase.co";
const SUPABASE_KEY="sb_publishable_cBsQcu8s-KopDwHA6G70SA_lsU_BRl_";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
async function check(){
  $("loginStatus").textContent="Checking session...";
  const {data,error}=await client.auth.getSession();
  if(error){$("loginStatus").textContent="Supabase error: "+error.message;return;}
  if(data.session){showAdmin();}else{$("loginStatus").textContent="Ready — enter your Supabase admin email and password.";}
}
function showAdmin(){$("loginPanel").classList.add("hidden");$("adminPanel").classList.remove("hidden");load();}
$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 $("loginStatus").textContent="Signing in...";
 const {data,error}=await client.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
 if(error){$("loginStatus").textContent="Login failed: "+error.message;return;}
 if(!data.session){$("loginStatus").textContent="Login returned no session. Check Supabase Auth settings.";return;}
 $("loginStatus").textContent="Signed in!";
 showAdmin();
});
$("logoutBtn").onclick=async()=>{await client.auth.signOut();location.reload();};
async function load(){
 const {data,error}=await client.from("products").select("*").order("created_at",{ascending:false});
 if(error){$("formStatus").textContent="Products error: "+error.message;return;}
 $("adminProducts").innerHTML=data.map(p=>"<article class='card'><div class='card-info'><h3>"+esc(p.name)+"</h3><p class='muted'>"+esc(p.category)+"</p><p class='price'>"+Number(p.price).toFixed(2)+"</p><button class='small-button' onclick='del("+p.id+")'>Delete</button></div></article>").join("")||"<p class='muted'>No products yet.</p>";
}
$("productForm").addEventListener("submit",async e=>{
 e.preventDefault();$("formStatus").textContent="Adding...";
 let image_url=null, file=$("image").files[0];
 if(file){
  let path=Date.now()+"-"+file.name.toLowerCase().replace(/[^a-z0-9._-]/g,"-");
  let up=await client.storage.from("products").upload(path,file);
  if(up.error){$("formStatus").textContent="Image upload failed: "+up.error.message;return;}
  image_url=client.storage.from("products").getPublicUrl(path).data.publicUrl;
 }
 let {error}=await client.from("products").insert({name:$("name").value.trim(),price:Number($("price").value),category:$("category").value,sizes:$("sizes").value.trim(),description:$("description").value.trim(),image_url});
 if(error){$("formStatus").textContent="Product failed: "+error.message;return;}
 $("formStatus").textContent="Product added successfully.";e.target.reset();load();
});
async function del(id){if(!confirm("Delete product?"))return;let {error}=await client.from("products").delete().eq("id",id);if(error)alert(error.message);else load();}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
check();
</script>
</body>
</html>
